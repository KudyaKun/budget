<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расходы</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расходы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #f5f5f1; --card: #ffffff; --text: #1b1b19; --muted: #7b7b74; --line: #e6e6df; --accent: #1f7a5a; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --card: #1c1c1a; --text: #f1f1ec; --muted: #9a9a92; --line: #2c2c29; --accent: #45b888; --accent-text: #0d1f17; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-sizing: border-box; }
  img { width: 64px; height: 64px; border-radius: 15px; display: block; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  button { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px;
    background: var(--accent); color: var(--accent-text); cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<div id="login">
  <form id="form">
    <img src="apple-touch-icon.png" alt="">
    <h1>Мои расходы</h1>
    <p>Введите секретное слово. Его спросят только один раз на этом устройстве.</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="Секретное слово" required>
    <button type="submit">Войти</button>
  </form>
</div>

<script>
  // Адрес приложения (без секретного слова — его здесь нет)
  const APP = 'https://script.google.com/macros/s/AKfycbyezmLrGO8JE5nwWESKBgO19HRYjA0xRVgSib6g2K-QFl-wEG5MbZSO07eEWcaRSOa23g/exec';
  const STORE = 'expenses-key';

  function getKey() { try { return localStorage.getItem(STORE) || ''; } catch (e) { return ''; } }
  function setKey(k) { try { localStorage.setItem(STORE, k); } catch (e) {} }
  function clearKey() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function open(key) {
    document.getElementById('login').style.display = 'none';
    const f = document.createElement('iframe');
    f.src = APP + '?key=' + encodeURIComponent(key);
    f.title = 'Мои расходы';
    document.getElementById('app').replaceChildren(f);
  }

  function showLogin() {
    document.getElementById('app').replaceChildren();
    document.getElementById('login').style.display = 'flex';
  }

  // Открыть страницу с #logout в конце адреса — забыть слово и спросить заново
  if (location.hash === '#logout') { clearKey(); history.replaceState(null, '', location.pathname); }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const k = document.getElementById('key').value.trim();
    if (!k) return;
    setKey(k);
    open(k);
  });

  const saved = getKey();
  if (saved) open(saved); else showLogin();
</script>
</body>
</html>
